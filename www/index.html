        }

        #map {
            height: 45vh;

        }

        #lista {

            padding: 10px;
        }

        .empresa {
            background: #1e1e1e;
            margin-bottom: 10px;
            padding: 15px;
            border-radius: 10px;
            border-left: 5px solid #0d47a1;
        }

        button {
            margin-top: 10px;
            padding: 10px;
            width: 100%;
            border: none;
            border-radius: 5px;
            background: #0d47a1;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>

let map, markers = [], directionsService, directionsRenderer;

function initMap() {
    map = new google.maps.Map(document.getElementById("map"), {
        zoom: 11,
        center: { lat: 32.52, lng: -117.03 }
    });

    directionsService = new google.maps.DirectionsService();
    directionsRenderer = new google.maps.DirectionsRenderer();
    directionsRenderer.setMap(map);

    actualizarVista(empresas);
}

function actualizarVista(lista) {
    mostrarEmpresas(lista);
    mostrarLista(lista);
}

function mostrarEmpresas(lista) {
    markers.forEach(m => m.setMap(null));
    markers = [];

    lista.forEach(e => {
        const marker = new google.maps.Marker({
            position: { lat: e.lat, lng: e.lng },
            map: map
        });

        const info = new google.maps.InfoWindow({
            content: `<b>${e.nombre}</b><br>
            <button onclick="mostrarRuta(${e.lat}, ${e.lng})">Ver ruta</button>`
        });

        marker.addListener("click", () => info.open(map, marker));
        markers.push(marker);
    });
}

function mostrarLista(lista) {
    const contenedor = document.getElementById("lista");
    contenedor.innerHTML = "";

    lista.forEach(e => {
        contenedor.innerHTML += `
            <div class="empresa">
                <b>${e.nombre}</b><br>
                <small>${e.carreras.join(", ")}</small><br>
                <button onclick="mostrarRuta(${e.lat}, ${e.lng})">📍 Ver ruta</button>
            </div>
        `;
    });
}

function mostrarRuta(lat, lng) {
    navigator.geolocation.getCurrentPosition(pos => {
        directionsService.route({
            origin: {
                lat: pos.coords.latitude,
                lng: pos.coords.longitude
            },
            destination: { lat, lng },
            travelMode: "DRIVING"
        }, (result, status) => {
            if (status === "OK") {
                directionsRenderer.setDirections(result);
            }
        });
    });
}

function filtrar() {
    const texto = document.getElementById("buscador").value.toLowerCase();
    const carrera = document.getElementById("carrera").value;

    let resultado = empresas.filter(e =>
        e.nombre.toLowerCase().includes(texto)
    );

    if (carrera !== "Todas") {
        resultado = resultado.filter(e =>
            e.carreras.includes(carrera)
        );
    }

    actualizarVista(resultado);
}

document.getElementById("buscador").addEventListener("input", filtrar);
document.getElementById("carrera").addEventListener("change", filtrar);
</script>

<script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyCsjScZmxFpcDc-EtBlTrUVC_iZ_xivI_U&callback=initMap" async defer></script>
